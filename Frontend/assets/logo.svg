<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b32c9"/>
      <stop offset="50%" stop-color="#c02577"/>
      <stop offset="100%" stop-color="#c79a49"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="60" cy="60" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c02577" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b32c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#glowGrad)"/>
  <rect x="8" y="8" width="104" height="104" rx="30" fill="#ffffff" stroke="url(#logoGrad)" stroke-width="2" stroke-opacity="0.3"/>
  <g transform="translate(60,60)">
    <!-- 8 Petals arranged in floral mandala -->
    <path d="M0 -36 C10 -22 10 -10 0 0 C-10 -10 -10 -22 0 -36 Z" fill="url(#logoGrad)" opacity="0.95"/>
    <path d="M0 36 C10 22 10 10 0 0 C-10 10 -10 22 0 36 Z" fill="url(#logoGrad)" opacity="0.95"/>
    <path d="M36 0 C22 10 10 10 0 0 C10 -10 22 -10 36 0 Z" fill="url(#logoGrad)" opacity="0.95"/>
    <path d="M-36 0 C-22 10 -10 10 0 0 C-10 -10 -22 -10 -36 0 Z" fill="url(#logoGrad)" opacity="0.95"/>
    <path d="M25 -25 C22 -10 12 -5 0 0 C5 -12 10 -22 25 -25 Z" fill="#c79a49" opacity="0.9"/>
    <path d="M-25 -25 C-22 -10 -12 -5 0 0 C-5 -12 -10 -22 -25 -25 Z" fill="#c79a49" opacity="0.9"/>
    <path d="M25 25 C22 10 12 5 0 0 C5 12 10 22 25 25 Z" fill="#c79a49" opacity="0.9"/>
    <path d="M-25 25 C-22 10 -12 5 0 0 C-5 12 -10 22 -25 25 Z" fill="#c79a49" opacity="0.9"/>
    <!-- Center Jewel -->
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <circle cx="0" cy="0" r="4.5" fill="#c02577"/>
  </g>
