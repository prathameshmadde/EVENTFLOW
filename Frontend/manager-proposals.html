<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Submitted Proposals — EventFlow</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="experience.css">
</head>
<body>
  <div class="ef-loader" id="ef-loader"><div class="ef-loader-mark">Event<span>Flow</span></div><div class="ef-loader-bar"><i></i></div></div>
  <canvas class="ef-scene" id="ef-scene"></canvas>
  <div class="ef-scene-veil"></div>

  <div class="app-shell">
    <aside class="sidebar ef-manager-sidebar" id="manager-sidebar">
      <a href="index.html" class="side-brand" id="brand-link">
        <div class="brand-mark">✦</div>
        <div>
          <strong>Event<span>Flow</span></strong>
          <span class="side-brand-tag">Manager Suite</span>
        </div>
      </a>

      <div class="sidebar-nav-group">
        <a href="manager-dashboard.html" class="side-link" id="side-nav-dashboard">
          <span class="side-icon-box" data-ef-icon="layoutDashboard" data-size="18"></span>
          <span class="side-label">Dashboard</span>
        </a>
        <a href="manager-requirements.html" class="side-link" id="side-nav-requirements">
          <span class="side-icon-box" data-ef-icon="clipboardList" data-size="18"></span>
          <span class="side-label">Open Requirements</span>
        </a>
        <a href="manager-proposals.html" class="side-link active" id="side-nav-proposals">
          <span class="side-icon-box" data-ef-icon="arrowLeftRight" data-size="18"></span>
          <span class="side-label">My Proposals</span>
        </a>
        <a href="services.html" class="side-link" id="side-nav-services">
          <span class="side-icon-box" data-ef-icon="sparkles" data-size="18"></span>
          <span class="side-label">Services</span>
        </a>
        <a href="bookings.html" class="side-link" id="side-nav-bookings">
          <span class="side-icon-box" data-ef-icon="calendarCheck" data-size="18"></span>
          <span class="side-label">Bookings</span>
        </a>
        <a href="tasks.html" class="side-link" id="side-nav-tasks">
          <span class="side-icon-box" data-ef-icon="checkSquare" data-size="18"></span>
          <span class="side-label">Tasks</span>
        </a>
        <a href="feedback.html" class="side-link" id="side-nav-feedback">
          <span class="side-icon-box" data-ef-icon="star" data-size="18"></span>
          <span class="side-label">Feedback</span>
        </a>
        <a href="#support" class="side-link" id="side-nav-support" onclick="EventFlow.openSupportModal(event)">
          <span class="side-icon-box" data-ef-icon="helpCircle" data-size="18"></span>
          <span class="side-label">Support</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-divider"></div>
        <div class="sidebar-user-card" id="side-user-card">
          <div class="sidebar-user-avatar">AM</div>
          <div class="sidebar-user-info">
            <strong class="sidebar-user-name">Arjun Mehta</strong>
            <span class="sidebar-user-role">Event Producer</span>
          </div>
        </div>
        <a href="login.html" class="side-link side-link-logout" id="side-nav-logout" onclick="EventFlow.handleLogout(event)">
          <span class="side-icon-box" data-ef-icon="logout" data-size="18"></span>
          <span class="side-label">Logout</span>
        </a>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-top">
        <div style="display:flex;align-items:center;gap:14px;">
          <button class="sidebar-toggle btn btn-outline btn-sm" aria-label="Toggle Navigation">
            <span data-ef-icon="menu" data-size="18"></span>
          </button>
          <h1>My Submitted Proposals</h1>
        </div>
        <div class="top-tools">
          <div class="eventflow-account"></div>
          <a href="manager-requirements.html" class="btn btn-primary btn-sm">+ Bid on New Brief</a>
        </div>
      </header>

      <main class="dash-content">
        <div class="panel">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Brief Title</th>
                  <th>Client</th>
                  <th>Event Date</th>
                  <th>Quotation</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="proposals-tbody">
                <tr><td colspan="6">Loading proposals...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="experience.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var tbody = document.getElementById('proposals-tbody');
      
      function loadProposals() {
        EventFlow.apiGet('/proposals').then(function(res) {
          var list = Array.isArray(res) ? res : (res.proposals || []);
          if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="6"><div class="ef-empty-state"><h3>No Proposals Submitted</h3><p>You haven\'t bid on any briefs yet.</p></div></td></tr>';
            return;
          }

          tbody.innerHTML = list.map(function(prop) {
            var title = prop.requirementTitle || prop.requirement_title || 'Event Brief';
            var client = prop.customerName || prop.customer_name || 'Client';
            var date = prop.eventDate || prop.event_date || prop.date;
            var quote = prop.price || prop.proposalPrice || prop.proposal_price || prop.estimatedAmount || prop.estimated_amount || 0;
            var status = prop.status || 'SUBMITTED';
            
            var badgeClass = (status === 'ACCEPTED') ? 'accepted' : (status === 'REJECTED' ? 'rejected' : 'submitted');
            var actionBtn = (status === 'ACCEPTED') 
                ? '<a href="booking.html" class="btn btn-outline btn-sm">View Booking</a>' 
                : '<button class="btn btn-ghost btn-sm">Edit Bid</button>';
                
            return '<tr>' +
              '<td><strong>' + title + '</strong></td>' +
              '<td>' + client + '</td>' +
              '<td>' + (date ? EventFlow.formatDate(date) : '-') + '</td>' +
              '<td><strong>' + EventFlow.formatCurrency(quote) + '</strong></td>' +
              '<td><span class="badge ' + badgeClass + '">' + status + '</span></td>' +
              '<td>' + actionBtn + '</td>' +
            '</tr>';
          }).join('');
        }).catch(function(err) {
          tbody.innerHTML = '<tr><td colspan="6"><div class="ef-empty-state"><h3>Error loading proposals</h3><p>' + err.message + '</p></div></td></tr>';
        });
      }

      loadProposals();
    });
  </script>
</body>
</html>
